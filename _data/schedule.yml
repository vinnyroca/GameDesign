weeks:
  - week_number: 1
    days:
      
      - day: "Tuesday"
        date: "10.20"
       
        events:
          - text: "Course Overview"
          - text: "Lecture: Play"
          - text: "Play, Assign and Begin Spielebuch Games"
       
        due:
          - text: "READ: David Graeber. What's the Point If We Can't Have Fun?"
            link: "example.com"
          - text: "READ:  Salen and  Zimmerman. Ch. 22: Defining Play from Rules of Play"
          - text: "READ:  Huizinga. Nature and Significance of Play as a Cultural Phenomenon from The Game Design Reader"
          - text: "OPTIONAL: Sutton-Smith. Play and Ambiguity from The Game Design Reader"
      
      - day: "Thursday"
        date: "10.21"
        
        events:
          - text: "Play Spielebuch Games"
          - text: "Lecture: Play Design"
          - text: "Assign: Redesign"
        
        due:
          - text: "PROJECT: Spielebuch"
          - text: "READ: De Koven. Excerpts from The Well-Played Game"
            link: "example.com"
          - text: "READ: Salen and Zimmerman. Ch. 25: “Games as the Play of Meaning” from Rules of Play"
          - text: "READ: Macklin and Sharp. Ch. 1: Games Design and Play from Games, Design and Play"
 
